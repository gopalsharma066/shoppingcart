apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR-ORG/YOUR-GITOPS-REPO.git
    targetRevision: main
    path: manifests/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-app